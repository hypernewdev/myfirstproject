<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        body {
            background-color: #10152b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        h1 {
            color: #20d9d2;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff4f81;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff2a6d;
        }
    </style>
</head>
<body>
    <h1>Chào mừng đến với dự án GitHub đầu tiên của tôi! 🎉</h1>
    <p>Tôi đang tập tành làm web và game.</p>
    <button onclick="thongBao()">Bấm vào đây đi</button>

    <script>
        function thongBao() {
            alert("Tuyệt vời! Bạn vừa tương tác thành công với trang web trên GitHub!");
        }
    </script>
</body>
</html>
